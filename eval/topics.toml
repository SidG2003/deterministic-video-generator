# Fixed sample prompts for comparing pipelines (modes, models, prompt versions).
#
# Pick one by number, id or name:
#     python -m dvg.topics                      # list them
#     python -m dvg.topics 5                    # show one (also: t05, rocket-orbit)
#     python -m dvg.generate --topic-id 5 --mode freeform
#
# Rules — keep comparisons valid:
# - Never change the `prompt` (or `depth`) of an existing entry: runs record the
#   topic id, and results are only comparable if the input stayed the same.
#   To try a different wording, add a NEW entry with the next id.
# - Ids are permanent; don't renumber or reuse them. Ids match the numbering of
#   the original list (prompt 1 = t01).
# - Prompts are kept verbatim as written (including wording quirks) — they are
#   the exact user input.
# - `stresses` says what the topic exercises, so a pipeline's weak spots show up.

[[topic]]
id = "t01"
name = "entropy"
prompt = "I want to build real intuition for entropy and the second law of thermodynamics — why disorder tends to increase and what that actually means at the level of atoms and molecules. Help me understand this"
depth = "standard"
stresses = ["particles", "statistics", "3d", "heavy-render"]

[[topic]]
id = "t02"
name = "blue-sky"
prompt = "Explain why the sky is blue and sunsets are red — I want to understand how light scattering actually causes this"
depth = "standard"
stresses = ["light-waves", "scattering", "colour"]

[[topic]]
id = "t03"
name = "prism"
prompt = "I want to understand why a prism splits white light into a rainbow — what's actually different about each color that makes this happen. Also help build up an understanding of refractive index and how it varies between materials."
depth = "standard"
stresses = ["optics", "refraction", "colour", "two-part-question"]

[[topic]]
id = "t04"
name = "em-induction"
prompt = "I want to understand how electromagnetic induction works — how a changing magnetic field creates an electric current, and how it relates to generator and motor."
depth = "standard"
stresses = ["fields", "3d", "physical-mechanism", "applications"]

[[topic]]
id = "t05"
name = "rocket-orbit"
prompt = "Walk me through how a rocket actually gets to orbit — start with Newton's third law and a simple thrust example, build up to how mass loss changes the acceleration over time (the rocket equation), show staging and why we drop empty fuel tanks, and end with how all of that comes together to reach orbital velocity instead of just falling back down."
depth = "standard"
stresses = ["long-buildup", "many-sections", "formulas", "motion"]

[[topic]]
id = "t06"
name = "limits"
prompt = "I want to understand the concept of a limit and why calculus needed it — what problem it solves that algebra alone couldn't handle."
depth = "standard"
stresses = ["calculus", "graphs", "formulas"]

[[topic]]
id = "t07"
name = "bayes"
prompt = "Explain Bayes' theorem such that probability updating feel intuitive instead of just a formula to memorize."
depth = "standard"
stresses = ["formulas", "probability-visuals", "intuition"]

[[topic]]
id = "t08"
name = "integrals"
prompt = "I really want to build intuition for what an integral actually is — why it represents accumulated area, and how that connects back to the idea of a derivative."
depth = "standard"
stresses = ["calculus", "graphs", "area", "accumulation"]

[[topic]]
id = "t09"
name = "matrix-transforms"
prompt = "I want to understand matrix transformations — what a matrix is actually doing to space when you multiply a vector by it, and why that matters for things like rotations, scaling, and computer graphics."
depth = "standard"
stresses = ["linear-algebra", "grids", "transformations"]

[[topic]]
id = "t10"
name = "fractals"
prompt = "I want to understand fractals and self-similarity — why some shapes look the same no matter how far you zoom in, and how something that simple can come from such a basic repeated rule."
depth = "standard"
stresses = ["recursion", "zoom", "heavy-render"]

[[topic]]
id = "t11"
name = "llms"
prompt = "I want to understand how LLMs work in a simple way"
depth = "standard"
stresses = ["abstract-concepts", "diagram", "short-prompt"]

[[topic]]
id = "t12"
name = "pendulum"
prompt = "Explain the time period and frequency of a pendulum, explaining the relation with respect to length of pendulum, mass of pendulum and gravity."
depth = "standard"
stresses = ["formulas", "controlled-variables", "physical-mechanism", "oscillation"]

[[topic]]
id = "t13"
name = "archimedes"
prompt = "I want to really understand Archimedes' principle — why some things float and others sink, what buoyant force really is, how it relates to the weight of water being displaced, and why the same object can float in the ocean but sink in a swimming pool."
depth = "standard"
stresses = ["forces", "fluids", "density", "controlled-variables", "buoyancy"]

[[topic]]
id = "t14"
name = "digestion"
prompt = "How does the digestive system works — what actually happens to food from the moment I eat it, how the body breaks it down and absorbs nutrients, and where all the leftover waste goes."
depth = "standard"
stresses = ["process-flow", "biology", "sequence", "organs"]

[[topic]]
id = "t15"
name = "archimedes-deep"
prompt = "I want to understand Archimedes' principle start with the basic question of why some things float and others sink even when they're heavy, introduce the idea of buoyant force and how it comes from water pushing back on an object, connect that to the idea that the buoyant force equals the weight of the water displaced, use a clear example like a solid metal ball sinking versus a hollow ball of the same material floating, then extend it to why a massive steel ship can float on the ocean, touch on why the same object might float in the ocean but sink in a swimming pool due to water density and salt content, and end with a clear takeaway on how this single principle explains floating, sinking, and even how submarines control their depth."
depth = "standard"
stresses = ["forces", "fluids", "density", "controlled-variables", "buoyancy", "worked-example", "process-flow"]
