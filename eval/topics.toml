# Fixed sample prompts for comparing pipelines (modes, models, prompt versions).
#
# Pick one by number, id or name:
#     python -m dvg.topics                      # list them
#     python -m dvg.topics 3                    # show one (also: t03, dns)
#     python -m dvg.generate --topic-id 3 --mode freeform
#
# Rules — keep comparisons valid:
# - Never change the `prompt` (or `depth`) of an existing entry: past runs record
#   the topic id, and results are only comparable if the input stayed the same.
#   To try a different wording, add a NEW entry with the next id.
# - Ids are permanent; don't renumber or reuse them.
# - `stresses` says what the topic exercises, so a pipeline's weak spots show up.
#
# Wording of t03-t06 and t09 matches earlier runs, so those stay comparable.

[[topic]]
id = "t01"
name = "entropy"
prompt = "Entropy and the second law of thermodynamics"
depth = "standard"
stresses = ["3d", "heavy-render", "many-sections"]

[[topic]]
